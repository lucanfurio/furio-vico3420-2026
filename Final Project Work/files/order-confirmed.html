<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Pub – Order Confirmed</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Barlow', sans-serif; overflow-x: hidden; background: #fff; }

    /* ── NAV ── */
    .site-nav { background: #ffffff; border-bottom: 2px solid #0d0d0d; padding: 0.4rem 2rem; }
    .nav-logo img { height: 80px; width: auto; display: block; }
    .nav-links a {
      font-family: 'Barlow', sans-serif; font-weight: 400; font-size: 1.1rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: #0d0d0d;
      text-decoration: none; padding: 0 1rem;
    }
    .nav-links a:hover, .nav-links a.active { color: #000000; font-weight: 700; }
    .nav-social a {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border: 1.5px solid #0d0d0d; border-radius: 50%;
      color: #0d0d0d; font-size: 0.9rem; text-decoration: none;
      margin-left: 0.35rem; transition: background 0.2s, color 0.2s;
    }
    .nav-social a:hover { background: #0d0d0d; color: #f2ede6; }

    /* ── CONFIRMED PAGE ── */
    .confirmed-page {
      max-width: 700px;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
      text-align: center;
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .confirmed-title {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0d0d0d;
      margin-bottom: 0.6rem;
    }

    .confirmed-subtitle {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 3rem;
    }

    .order-summary-block {
      width: 100%;
      text-align: left;
      border-top: 2px solid #0d0d0d;
      border-bottom: 2px solid #0d0d0d;
      padding: 1.5rem 0;
      margin-bottom: 2rem;
    }

    @font-face { font-family: 'Blackletter'; src: url('jblack.ttf') format('truetype'); }

    .confirmed-item {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid #eee;
    }
    .confirmed-item:last-of-type { border-bottom: none; }
    .confirmed-item-img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .confirmed-item-name {
      font-family: 'Blackletter', serif;
      font-size: 1rem;
      flex: 1;
      line-height: 1.3;
    }
    .confirmed-item-qty {
      font-family: 'Barlow', sans-serif;
      font-size: 0.8rem;
      font-weight: 300;
      color: #666;
    }
    .confirmed-item-price {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      min-width: 60px;
      text-align: right;
    }

    .confirmed-totals {
      width: 100%;
      text-align: left;
      margin-bottom: 2.5rem;
    }
    .confirmed-totals p {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      color: #333;
      margin-bottom: 0.2rem;
    }
    .confirmed-totals .total-line {
      font-weight: 700;
      font-size: 1.05rem;
      color: #0d0d0d;
      margin-top: 0.5rem;
    }

    .continue-btn {
      display: inline-block;
      padding: 0.8rem 2.5rem;
      background: #ffffff;
      border: 2px solid #0d0d0d;
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      color: #0d0d0d;
      transition: background 0.2s, color 0.2s;
    }
    .continue-btn:hover { background: #0d0d0d; color: #fff; }

    /* ── FOOTER ── */
    .site-footer { width: 100%; background-image: url('footer.png'); background-size: cover; background-position: center; padding: 3rem; }
    .footer-inner { display: flex; align-items: flex-start; justify-content: flex-start; gap: 5rem; }
    .footer-heading { font-family: 'Barlow', sans-serif; font-weight: 350; font-size: 1.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: #ffffff; margin-bottom: 0.6rem; }
    .footer-body { font-family: 'Barlow', sans-serif; font-weight: 300; font-size: 0.95rem; line-height: 1.8; color: #cccccc; }
    .footer-logo-col { text-align: right; margin-left: auto; }
    .footer-logo { height: 120px; width: auto; margin-top: 20px; margin-right: 20px; }

    @media (max-width: 767px) {
      .footer-inner { flex-direction: column; align-items: flex-start; }
      .footer-logo-col { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="site-nav navbar navbar-expand-md">
    <div class="container-fluid px-0">
      <a href="index.html" class="nav-logo">
        <img src="Asset_1_4x_1.png" alt="The Pub – Since 1975, Athens, Ohio" />
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navConfirmed" aria-controls="navConfirmed" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navConfirmed">
        <div class="nav-links d-flex flex-column flex-md-row align-items-start align-items-md-center mx-auto py-2 py-md-0">
          <a href="index.html">Home</a>
          <a href="merch.html">Merch</a>
          <a href="menu.html">Menu</a>
          <a href="aboutus.html">About Us</a>
        </div>
        <div class="nav-social d-flex align-items-center mt-2 mt-md-0 pb-2 pb-md-0">
          <a href="cart.html" aria-label="Cart"><i class="bi bi-cart3"></i></a>
          <a href="mailto:thepubathens@gmail.com" aria-label="Email"><i class="bi bi-envelope"></i></a>
          <a href="https://x.com/The_Pub_Bar" aria-label="X"><i class="bi bi-twitter-x"></i></a>
          <a href="https://www.facebook.com/ThePubAthensOhio/" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="https://www.instagram.com/thepubbar/" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        </div>
      </div>
    </div>
  </nav>

  <div class="confirmed-page">
    <h1 class="confirmed-title">Order Confirmed</h1>
    <p class="confirmed-subtitle">Your order is on the way!</p>

    <div class="order-summary-block" id="confirmed-items"></div>

    <div class="confirmed-totals" id="confirmed-totals"></div>

    <a href="index.html" class="continue-btn">Continue Shopping</a>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <p class="footer-heading">Current Hours:</p>
        <p class="footer-body">Kitchen: 11am – 7pm<br/>Bar: 11am – 2am</p>
      </div>
      <div class="footer-col">
        <p class="footer-heading">Location:</p>
        <p class="footer-body">39 North Court Street<br/>Athens, Ohio 45701<br/>740-592-2699</p>
      </div>
      <div class="footer-col footer-logo-col">
        <img src="white_logo.png" alt="The Pub – Since 1975, Athens, Ohio" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const order = JSON.parse(localStorage.getItem('pubLastOrder') || 'null');

    const itemsContainer = document.getElementById('confirmed-items');
    const totalsContainer = document.getElementById('confirmed-totals');

    if (!order || !order.cart || order.cart.length === 0) {
      itemsContainer.innerHTML = '<p style="font-family:Barlow,sans-serif;color:#999;padding:1rem 0;">No order details found.</p>';
    } else {
      itemsContainer.innerHTML = order.cart.map(item => `
        <div class="confirmed-item">
          <img class="confirmed-item-img" src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">
          <div style="flex:1">
            <div class="confirmed-item-name">${item.name}</div>
            <div class="confirmed-item-qty">Qty: ${item.qty}</div>
          </div>
          <div class="confirmed-item-price">$${(item.price * item.qty).toFixed(2)}</div>
        </div>`).join('');

      totalsContainer.innerHTML = `
        <p>Subtotal: $${order.subtotal.toFixed(2)}</p>
        <p>Shipping: $${order.shipping.toFixed(2)}</p>
        <p class="total-line">Total: USD $${order.total.toFixed(2)}</p>`;
    }
  </script>
</body>
</html>
