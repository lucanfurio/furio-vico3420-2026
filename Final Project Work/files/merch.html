<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Pub – Merch</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    .site-nav {
      background: #ffffff;
      border-bottom: 2px solid #0d0d0d;
      padding: 0.4rem 2rem;
    }

    .nav-logo img {
      height: 80px;
      width: auto;
      display: block;
    }

    .nav-links a {
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #0d0d0d;
      text-decoration: none;
      padding: 0 1rem;
    }
    .nav-links a:hover { color: #000000; font-weight: 700; }
    .nav-links a.active { color: #000000; font-weight: 700; }

    .nav-social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1.5px solid #0d0d0d;
      border-radius: 50%;
      color: #0d0d0d;
      font-size: 0.9rem;
      text-decoration: none;
      margin-left: 0.35rem;
      transition: background 0.2s, color 0.2s;
    }
    .nav-social a:hover {
      background: #0d0d0d;
      color: #f2ede6;
    }



    /* ── ACCORDION / MERCH ── */
    .merch-section {
      padding: 0;
    }

    .accordion-item {
      border: none;
      border-bottom: 2px solid #0d0d0d;
      border-radius: 0 !important;
    }
    .accordion-item:first-of-type {
      border-top: 2px solid #0d0d0d;
    }

    .accordion-button {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #0d0d0d;
      background: #ffffff;
      padding: 1.4rem 2rem;
      box-shadow: none !important;
    }
    .accordion-button:not(.collapsed) {
      color: #0d0d0d;
      background: #ffffff;
    }
    .accordion-button::after {
      display: none; /* hide default Bootstrap chevron */
    }

    /* Custom +/- indicator */
    .accordion-button .acc-icon {
      margin-left: auto;
      font-size: 1.5rem;
      font-weight: 300;
      line-height: 1;
      transition: transform 0.2s;
    }
    .accordion-button:not(.collapsed) .acc-icon::before {
      content: '−';
    }
    .accordion-button.collapsed .acc-icon::before {
      content: '+';
    }

    .accordion-body {
      padding: 2rem 2rem 2.5rem;
      background: #ffffff;
      /* Items will go here */
      min-height: 60px;
    }
    .menu-img {
  max-width: 300px;
}

/* Accordian Menu Items */
.menu-desc {
  font-family: 'Barlow', sans-serif;
  font-size: 0.95rem;
  color: #555;
  margin: 0.5rem 0;
  font-weight: 200;
}

.menu-price {
  font-family: 'Barlow', sans-serif;
  font-size: 0.95rem;
  letter-spacing: 0.05em;
  margin-top: 0.5rem;
  font-weight: 600;
}
.menu-item {
  min-height: 180px;
}

@font-face {
  font-family: 'Blackletter';
  src: url('jblack.ttf') format('truetype');
}

.menu-item-title {
  font-family: 'Blackletter', serif;
  font-size: 2rem;
  margin-bottom: 0.4rem;
  letter-spacing: 5%;
}
    /* ── FOOTER ── */
    .site-footer {
      width: 100%;
      background-image: url('footer.png');
      background-size: cover;
      background-position: center;
      padding: 3rem;
    }
    .footer-inner {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 5rem;
    }
    .footer-heading {
      font-family: 'Barlow', sans-serif;
      font-weight: 350;
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }
    .footer-body {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #cccccc;
    }
    .footer-logo-col {
      text-align: right;
      margin-left: auto;
    }
    .footer-logo {
      height: 120px;
      width: auto;
      margin-top: 20px;
      margin-right: 20px;
    }

    @media (max-width: 767px) {
      .footer-inner { flex-direction: column; align-items: flex-start; }
      .footer-logo-col { text-align: left; }
      .accordion-button { font-size: 1.1rem; padding: 1.2rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="site-nav navbar navbar-expand-md">
    <div class="container-fluid px-0">

      <a href="index.html" class="nav-logo">
        <img src="Asset_1_4x_1.png" alt="The Pub – Since 1975, Athens, Ohio" />
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMerch" aria-controls="navMerch" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMerch">
        <div class="nav-links d-flex flex-column flex-md-row align-items-start align-items-md-center mx-auto py-2 py-md-0">
          <a href="index.html">Home</a>
          <a href="merch.html" class="active">Merch</a>
          <a href="menu.html">Menu</a>
          <a href="#">About Us</a>
        </div>
        <div class="nav-social d-flex align-items-center mt-2 mt-md-0 pb-2 pb-md-0">
          <a href="#" aria-label="Cart"><i class="bi bi-cart3"></i></a>
          <a href="#" aria-label="Email"><i class="bi bi-envelope"></i></a>
          <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
          <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        </div>
      </div>

    </div>
  </nav>

  <!-- MERCH ACCORDION -->
  <div class="merch-section">
    <div class="accordion accordion-flush" id="merchAccordion">

      <!-- GLASSWARE -->
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
            data-bs-toggle="collapse" data-bs-target="#glassware"
            aria-expanded="false" aria-controls="glassware">
            Glassware
            <span class="acc-icon"></span>
          </button>
        </h2>
        <div id="glassware" class="accordion-collapse collapse" data-bs-parent="#merchAccordion">
          <div class="accordion-body">
            <!-- Glassware items go here -->
          </div>
        </div>
      </div>

      <!-- T-SHIRT -->
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
            data-bs-toggle="collapse" data-bs-target="#t-shirt"
            aria-expanded="false" aria-controls="t-shirt">
            T-shirt
            <span class="acc-icon"></span>
          </button>
        </h2>
        <div id="t-shirt" class="accordion-collapse collapse" data-bs-parent="#merchAccordion">
          <div class="accordion-body">
            <!-- T-Shirt items will go here -->
          </div>
        </div>
      </div>

      <!-- SWEATERS -->
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
            data-bs-toggle="collapse" data-bs-target="#sweaters"
            aria-expanded="false" aria-controls="sweaters">
            Sweaters
            <span class="acc-icon"></span>
          </button>
        </h2>
        <div id="sweaters" class="accordion-collapse collapse" data-bs-parent="#merchAccordion">
          <div class="accordion-body">
            <!-- Sweater items will go here -->
          </div>
        </div>
      </div>

      <!-- HOODIES -->
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
            data-bs-toggle="collapse" data-bs-target="#hoodies"
            aria-expanded="false" aria-controls="hoodies">
            Hoodies
            <span class="acc-icon"></span>
          </button>
        </h2>
        <div id="hoodies" class="accordion-collapse collapse" data-bs-parent="#merchAccordion">
          <div class="accordion-body">
            <!-- Hoodie items will go here -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-inner">

      <div class="footer-col">
        <p class="footer-heading">Current Hours:</p>
        <p class="footer-body">Kitchen: 11am – 7pm<br/>Bar: 11am – 2am</p>
      </div>

      <div class="footer-col">
        <p class="footer-heading">Location:</p>
        <p class="footer-body">39 North Court Street<br/>Athens, Ohio 45701<br/>740-592-2699</p>
      </div>

      <div class="footer-col footer-logo-col">
        <img src="white_logo.png" alt="The Pub – Since 1975, Athens, Ohio" class="footer-logo" />
      </div>

    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
