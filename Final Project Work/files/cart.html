<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Pub – Cart</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Barlow', sans-serif; overflow-x: hidden; }

    /* ── NAV ── */
    .site-nav { background: #ffffff; border-bottom: 2px solid #0d0d0d; padding: 0.4rem 2rem; }
    .nav-logo img { height: 80px; width: auto; display: block; }
    .nav-links a {
      font-family: 'Barlow', sans-serif; font-weight: 400; font-size: 1.1rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: #0d0d0d;
      text-decoration: none; padding: 0 1rem;
    }
    .nav-links a:hover, .nav-links a.active { color: #000000; font-weight: 700; }
    .nav-social a {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border: 1.5px solid #0d0d0d; border-radius: 50%;
      color: #0d0d0d; font-size: 0.9rem; text-decoration: none;
      margin-left: 0.35rem; transition: background 0.2s, color 0.2s;
    }
    .nav-social a:hover { background: #0d0d0d; color: #f2ede6; }

    /* ── CART PAGE ── */
    .cart-page { padding: 3rem 2rem; max-width: 800px; margin: 0 auto; min-height: 60vh; }

    .cart-title {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .cart-empty {
      text-align: center;
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 1.1rem;
      color: #666;
      padding: 3rem 0;
    }
    .cart-empty a {
      color: #0d0d0d;
      font-weight: 600;
      text-decoration: underline;
    }

    /* Cart item row */
    .cart-item {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.2rem 0;
      border-bottom: 1px solid #ddd;
    }
    .cart-item-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .cart-item-info { flex: 1; }
    .cart-item-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }
    .cart-item-price {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      color: #444;
    }

    /* Qty controls */
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid #0d0d0d;
    }
    .qty-btn {
      background: none;
      border: none;
      width: 2rem;
      height: 2rem;
      font-size: 1.1rem;
      font-weight: 400;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .qty-btn:hover { background: #0d0d0d; color: #fff; }
    .qty-display {
      width: 2.2rem;
      text-align: center;
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      border-left: 1.5px solid #0d0d0d;
      border-right: 1.5px solid #0d0d0d;
      padding: 0.1rem 0;
    }

    .cart-item-total {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      min-width: 70px;
      text-align: right;
    }

    .cart-remove {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 0.3rem;
      transition: color 0.2s;
    }
    .cart-remove:hover { color: #c00; }

    /* Summary */
    .cart-summary {
      margin-top: 2.5rem;
      text-align: center;
    }
    .summary-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .summary-line {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 1rem;
      color: #333;
      margin-bottom: 0.2rem;
    }
    .total-label {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 1.2rem;
    }
    .total-amount {
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      font-size: 1.1rem;
      margin-top: 0.2rem;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      max-width: 380px;
      margin: 2rem auto 0;
      padding: 1rem;
      background: #ffffff;
      border: 2px solid #0d0d0d;
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .checkout-btn:hover { background: #0d0d0d; color: #fff; }

    /* ── FOOTER ── */
    .site-footer { width: 100%; background-image: url('footer.png'); background-size: cover; background-position: center; padding: 3rem; }
    .footer-inner { display: flex; align-items: flex-start; justify-content: flex-start; gap: 5rem; }
    .footer-heading { font-family: 'Barlow', sans-serif; font-weight: 350; font-size: 1.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: #ffffff; margin-bottom: 0.6rem; }
    .footer-body { font-family: 'Barlow', sans-serif; font-weight: 300; font-size: 0.95rem; line-height: 1.8; color: #cccccc; }
    .footer-logo-col { text-align: right; margin-left: auto; }
    .footer-logo { height: 120px; width: auto; margin-top: 20px; margin-right: 20px; }

    @media (max-width: 767px) {
      .footer-inner { flex-direction: column; align-items: flex-start; }
      .footer-logo-col { text-align: left; }
      .cart-item { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="site-nav navbar navbar-expand-md">
    <div class="container-fluid px-0">
      <a href="index.html" class="nav-logo">
        <img src="Asset_1_4x_1.png" alt="The Pub – Since 1975, Athens, Ohio" />
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navCart" aria-controls="navCart" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navCart">
        <div class="nav-links d-flex flex-column flex-md-row align-items-start align-items-md-center mx-auto py-2 py-md-0">
          <a href="index.html">Home</a>
          <a href="merch.html">Merch</a>
          <a href="menu.html">Menu</a>
          <a href="aboutus.html">About Us</a>
        </div>
        <div class="nav-social d-flex align-items-center mt-2 mt-md-0 pb-2 pb-md-0">
          <a href="cart.html" aria-label="Cart"><i class="bi bi-cart3"></i></a>
          <a href="mailto:thepubathens@gmail.com" aria-label="Email"><i class="bi bi-envelope"></i></a>
          <a href="https://x.com/The_Pub_Bar" aria-label="X"><i class="bi bi-twitter-x"></i></a>
          <a href="https://www.facebook.com/ThePubAthensOhio/" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="https://www.instagram.com/thepubbar/" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        </div>
      </div>
    </div>
  </nav>

  <!-- CART CONTENT -->
  <div class="cart-page">
    <h1 class="cart-title">Shopping Cart</h1>
    <div id="cart-items-container"></div>
    <div id="cart-summary" class="cart-summary" style="display:none;">
      <div class="summary-label">Summary</div>
      <p class="summary-line">Subtotal: <span id="subtotal"></span></p>
      <p class="summary-line">Shipping: $10.00</p>
      <div class="total-label">Total</div>
      <div class="total-amount" id="total"></div>
      <button class="checkout-btn" onclick="window.location.href='checkout.html'">Check Out</button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <p class="footer-heading">Current Hours:</p>
        <p class="footer-body">Kitchen: 11am – 7pm<br/>Bar: 11am – 2am</p>
      </div>
      <div class="footer-col">
        <p class="footer-heading">Location:</p>
        <p class="footer-body">39 North Court Street<br/>Athens, Ohio 45701<br/>740-592-2699</p>
      </div>
      <div class="footer-col footer-logo-col">
        <img src="white_logo.png" alt="The Pub – Since 1975, Athens, Ohio" class="footer-logo" />
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SHIPPING = 10;

    function getCart() {
      return JSON.parse(localStorage.getItem('pubCart') || '[]');
    }
    function saveCart(cart) {
      localStorage.setItem('pubCart', JSON.stringify(cart));
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-items-container');
      const summary = document.getElementById('cart-summary');

      if (cart.length === 0) {
        container.innerHTML = `<div class="cart-empty">Your cart is empty. <a href="merch.html">Browse Merch</a></div>`;
        summary.style.display = 'none';
        return;
      }

      let subtotal = 0;
      container.innerHTML = cart.map((item, i) => {
        const lineTotal = item.price * item.qty;
        subtotal += lineTotal;
        return `
          <div class="cart-item">
            <img class="cart-item-img" src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price">$${item.price.toFixed(2)} each</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
              <div class="qty-display">${item.qty}</div>
              <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
            </div>
            <div class="cart-item-total">$${lineTotal.toFixed(2)}</div>
            <button class="cart-remove" onclick="removeItem(${i})" title="Remove"><i class="bi bi-x-lg"></i></button>
          </div>`;
      }).join('');

      const total = subtotal + SHIPPING;
      document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('total').textContent = `USD $${total.toFixed(2)}`;
      summary.style.display = 'block';
    }

    function changeQty(index, delta) {
      const cart = getCart();
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      saveCart(cart);
      renderCart();
    }

    function removeItem(index) {
      const cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
